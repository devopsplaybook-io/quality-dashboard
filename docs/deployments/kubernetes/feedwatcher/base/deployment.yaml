apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-dashboard
  labels:
    app: quality-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: quality-dashboard
  template:
    metadata:
      labels:
        app: quality-dashboard
    spec:
      containers:
        - image: quality-dashboard
          name: quality-dashboard
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 20Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
          imagePullPolicy: Always
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: quality-dashboard
